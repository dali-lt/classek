<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>ClassLedger</title>
    <link rel="icon" type="image/svg+xml" href="Images/logo-icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="CSS/style.css" />
    <link rel="stylesheet" href="CSS/welcome.css?v=24" />
    <link rel="stylesheet" href="CSS/test.css?v=24" />
    <link rel="stylesheet" href="CSS/chapters.css?v=24" />
  </head>
  <body class="student-body">
    <div class="student-wrap" id="studentApp" hidden>
      <header class="student-top">
        <img
          class="welcome-logo"
          src="Images/logo-wordmark.svg"
          alt="ClassLedger"
        />
        <div class="student-top-right">
          <div class="lang-switch" id="langSwitch">
            <button type="button" class="lang-btn" data-lang="en">EN</button>
            <button type="button" class="lang-btn" data-lang="ar">AR</button>
          </div>
          <div class="student-user-wrap">
            <button type="button" class="student-user" id="sUser" aria-haspopup="menu" aria-expanded="false"></button>
            <div class="student-menu" id="sMenu" role="menu" hidden></div>
          </div>
          <button type="button" class="student-out" id="sSignOut"></button>
        </div>
      </header>

      <section class="student-hero" id="sHero">
        <h1 id="sGreeting"></h1>
        <p id="sSub"></p>
      </section>

      <section class="week-strip" id="sWeek" aria-label="Calendar"></section>

      <div id="sPlacement"></div>


      <section class="student-section" id="sChaptersSection">
        <h2 id="sChaptersTitle"></h2>
        <div class="student-chapters" id="sChapters"></div>
      </section>

      <div id="sChapterView" hidden></div>
    </div>

    <!-- Profile card (same look as the teacher's "My account") -->
    <div class="modal-overlay" id="pOverlay">
      <div
        class="modal profile-modal modal-fixed"
        role="dialog"
        aria-modal="true"
        aria-labelledby="pTitle"
      >
        <button type="button" class="profile-gear" id="pGear"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
        <button type="button" class="profile-close" id="pClose">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
            <path d="m6 6 12 12M18 6 6 18" />
          </svg>
        </button>
        <div class="modal-scroll profile-scroll">
          <div class="profile-banner"></div>
          <div class="profile-avatar" id="pAvatar"></div>
          <div class="profile-body">
            <h2 class="profile-name" id="pTitle"></h2>
            <div id="pBody"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Placement test: a deck of cards -->
    <div class="modal-overlay test-overlay" id="tOverlay">
      <div class="deck">
        <span class="deck-ghost g1" aria-hidden="true"></span>
        <span class="deck-ghost g2" aria-hidden="true"></span>
        <div class="modal modal-fixed test-modal" role="dialog" aria-modal="true" aria-labelledby="tTitle">
          <button type="button" class="modal-x" id="tClose">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
              <path d="m6 6 12 12M18 6 6 18" />
            </svg>
          </button>
          <div class="tc-fixed" id="tHead" hidden></div>
          <div class="modal-scroll">
            <h2 id="tTitle" class="sr-only"></h2>
            <div id="tBody"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Settings box -->
    <div class="modal-overlay" id="setOverlay">
      <div class="modal modal-fixed" role="dialog" aria-modal="true" aria-labelledby="setTitle">
        <button type="button" class="modal-x" id="setClose">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
            <path d="m6 6 12 12M18 6 6 18" />
          </svg>
        </button>
        <div class="modal-scroll">
          <h2 id="setTitle"></h2>
          <div id="setBody"></div>
        </div>
      </div>
    </div>


    <script src="JS/firebase-config.js"></script>
    <script type="module" src="JS/student.js?v=24"></script>
  </body>
</html>
