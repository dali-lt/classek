<!doctype html>
<html lang="fr" dir="ltr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Classek</title>
    <link rel="icon" type="image/svg+xml" href="Images/logo-icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="CSS/style.css?v=68" />
    <link rel="stylesheet" href="CSS/welcome.css?v=68" />
    <link rel="stylesheet" href="CSS/test.css?v=70" />
    <link rel="stylesheet" href="CSS/chapters.css?v=78" />
  </head>
  <body class="student-body">
    <div class="student-shell" id="studentApp" hidden>
      <!-- side rail on big screens; on phones the same panel slides in from the side behind the menu button -->
      <button type="button" class="s-menu-btn" id="sMenuBtn" aria-controls="sRail" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
      </button>
      <button type="button" class="s-phone-logo" id="sPhoneLogo" aria-label="Classek"><img src="Images/logo-wordmark.svg" alt="" /></button>
      <div class="s-scrim" id="sScrim"></div>
      <aside class="s-rail" id="sRail">
        <button type="button" class="s-drawer-close" id="sDrawerClose">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
        </button>
        <button type="button" class="s-rail-brand" id="rBrand">
          <img class="s-brand-icon" src="Images/logo-icon.svg" alt="" />
          <img class="s-brand-full" src="Images/logo-wordmark.svg" alt="" />
          <span class="s-rail-label" id="rBrandLabel"></span>
        </button>
        <nav class="s-rail-nav" id="rNav">
          <button type="button" class="rail-btn s-rail-btn" id="rHome" data-go="home">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7M6 9.8V20h12V9.8" /></svg>
            <span class="s-rail-label"></span>
          </button>
          <button type="button" class="rail-btn s-rail-btn" id="rSubjects" data-go="subjects">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="2" /><rect x="13.5" y="3.5" width="7" height="7" rx="2" /><rect x="3.5" y="13.5" width="7" height="7" rx="2" /><rect x="13.5" y="13.5" width="7" height="7" rx="2" /></svg>
            <span class="s-rail-label"></span>
          </button>
          <button type="button" class="rail-btn s-rail-btn" id="rCourse" data-tab="course">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 6.4C10.4 5.2 8.3 4.6 5.4 4.6H3.5v13.9h1.9c2.9 0 5 .6 6.6 1.8 1.6-1.2 3.7-1.8 6.6-1.8h1.9V4.6h-1.9c-2.9 0-5 .6-6.6 1.8z" /><path d="M12 6.4v13.9" /></svg>
            <span class="s-rail-label"></span>
          </button>
          <button type="button" class="rail-btn s-rail-btn" id="rEx" data-tab="ex">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="4.5" y="3.5" width="15" height="17.5" rx="2.5" /><path d="M8.5 9.8l1.7 1.7 3.3-3.6M8.5 15.5h7" /></svg>
            <span class="s-rail-label"></span>
          </button>
          <button type="button" class="rail-btn s-rail-btn s-rail-notes" id="rNotes" data-tab="notes">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 3.5h8.5l5 5V18a2.5 2.5 0 0 1-2.5 2.5H6A2.5 2.5 0 0 1 3.5 18V6A2.5 2.5 0 0 1 6 3.5z" /><path d="M14.5 3.5v5h5M8 13h8M8 16.5h5" /></svg>
            <span class="s-rail-label"></span>
          </button>
        </nav>
        <div class="student-user-wrap s-rail-user">
          <div class="s-top-lang" id="sTopLang"></div>
          <button type="button" class="student-user" id="sUser" aria-haspopup="menu" aria-expanded="false"></button>
          <div class="student-menu" id="sMenu" role="menu" hidden></div>
        </div>
      </aside>

      <main class="student-wrap" id="sMain">
      <div class="home-grid" id="sHomeGrid">
        <div class="home-side" id="sHomeSide">
          <aside class="s-box s-me" id="sMe"></aside>
          <div id="sPlacement"></div>
        </div>
        <div class="home-col">
          <section class="s-resume" id="sResume"></section>
          <section class="week-strip" id="sWeek" aria-label="Calendrier"></section>
          <section class="student-section" id="sChaptersSection">
            <h2 id="sChaptersTitle"></h2>
            <div class="student-chapters" id="sChapters"></div>
          </section>
        </div>
      </div>

      <div id="sChapterView" hidden></div>
      </main>
    </div>

    <!-- Profile card (same look as the teacher's "My account") -->
    <div class="modal-overlay" id="pOverlay">
      <div
        class="modal profile-modal modal-fixed"
        role="dialog"
        aria-modal="true"
        aria-labelledby="pTitle"
      >
        <button type="button" class="profile-gear" id="pGear"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
        <button type="button" class="profile-close" id="pClose">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
            <path d="m6 6 12 12M18 6 6 18" />
          </svg>
        </button>
        <div class="modal-scroll profile-scroll">
          <div class="profile-banner"></div>
          <div class="profile-avatar" id="pAvatar"></div>
          <div class="profile-body">
            <h2 class="profile-name" id="pTitle"></h2>
            <div id="pBody"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Placement test: a deck of cards -->
    <div class="modal-overlay test-overlay" id="tOverlay">
      <div class="deck">
        <span class="deck-ghost g1" aria-hidden="true"></span>
        <span class="deck-ghost g2" aria-hidden="true"></span>
        <div class="modal modal-fixed test-modal" role="dialog" aria-modal="true" aria-labelledby="tTitle">
          <button type="button" class="modal-x" id="tClose">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
              <path d="m6 6 12 12M18 6 6 18" />
            </svg>
          </button>
          <div class="tc-fixed" id="tHead" hidden></div>
          <div class="modal-scroll">
            <h2 id="tTitle" class="sr-only"></h2>
            <div id="tBody"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Boîte à idées -->
    <div class="modal-overlay" id="fbOverlay">
      <div class="modal modal-fixed fb-modal" role="dialog" aria-modal="true" aria-labelledby="fbTitle">
        <button type="button" class="modal-x" id="fbClose">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
            <path d="m6 6 12 12M18 6 6 18" />
          </svg>
        </button>
        <div class="modal-scroll">
          <h2 id="fbTitle"></h2>
          <div id="fbBody"></div>
        </div>
      </div>
    </div>

    <!-- Settings box -->
    <div class="modal-overlay" id="setOverlay">
      <div class="modal modal-fixed" role="dialog" aria-modal="true" aria-labelledby="setTitle">
        <button type="button" class="modal-x" id="setClose">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
            <path d="m6 6 12 12M18 6 6 18" />
          </svg>
        </button>
        <div class="modal-scroll">
          <h2 id="setTitle"></h2>
          <div id="setBody"></div>
        </div>
      </div>
    </div>


    <script src="JS/firebase-config.js"></script>
    <script type="module" src="JS/student.js?v=78"></script>
  </body>
</html>
