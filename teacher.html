<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>ClassLedger</title>
    <link rel="icon" type="image/svg+xml" href="Images/logo-icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="CSS/style.css?v=49" />
  </head>
  <body>
    <div class="app-shell">
      <!-- phones: menu button (fixed) + side drawer, same idea as the student page -->
      <button type="button" class="t-menu-btn" id="tMenuBtn" aria-controls="tDrawer" aria-expanded="false" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
      </button>
      <div class="t-scrim" id="tScrim"></div>
      <aside class="t-drawer" id="tDrawer" inert>
        <button type="button" class="t-drawer-close" id="tDrawerClose" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
        </button>
        <img class="t-drawer-logo" src="Images/logo-wordmark.svg" alt="ClassLedger" />
        <nav class="t-drawer-nav">
          <button class="nav-target t-drawer-btn active" data-page="students" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z" /><path d="M22 10v6" /><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5" /></svg>
            <span data-from="pillStudentsLabel"></span>
          </button>
          <button class="nav-target t-drawer-btn" data-page="calendar" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="5" width="17" height="15" rx="2.5" /><path d="M3.5 9.5h17M8 3v3M16 3v3" /></svg>
            <span data-from="pillCalendarLabel"></span>
          </button>
          <button class="nav-target t-drawer-btn" data-page="payments" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="13" rx="2.5" /><path d="M3 10h18" /><circle cx="16.5" cy="14.5" r="1.3" fill="currentColor" stroke="none" /></svg>
            <span data-from="pillPaymentsLabel"></span>
          </button>
        </nav>
        <div class="t-drawer-foot">
          <div id="tDrawerSlot"></div>
          <div class="t-drawer-lang">
            <span id="tDrawerLangLabel"></span>
            <div class="lang-switch" id="tDrawerLang">
              <button type="button" class="lang-btn" data-lang="en">EN</button>
              <button type="button" class="lang-btn" data-lang="ar">AR</button>
            </div>
          </div>
        </div>
      </aside>
      <aside class="icon-rail">
        <div class="rail-brand">
          <img
            class="brand-icon"
            src="Images/logo-icon.svg"
            alt="ClassLedger"
            width="32"
            height="32"
          />
        </div>
        <nav class="rail-nav">
          <button
            class="nav-target rail-btn active"
            data-page="students"
            type="button"
            title="Students"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z" />
              <path d="M22 10v6" />
              <path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5" />
            </svg>
          </button>
          <button
            class="nav-target rail-btn"
            data-page="calendar"
            type="button"
            title="Calendar"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <rect x="3.5" y="5" width="17" height="15" rx="2.5" />
              <path d="M3.5 9.5h17M8 3v3M16 3v3" />
            </svg>
          </button>
          <button
            class="nav-target rail-btn"
            data-page="payments"
            type="button"
            title="Payments"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <rect x="3" y="6" width="18" height="13" rx="2.5" />
              <path d="M3 10h18" />
              <circle
                cx="16.5"
                cy="14.5"
                r="1.3"
                fill="currentColor"
                stroke="none"
              />
            </svg>
          </button>
        </nav>
      </aside>
      <button
        class="rail-btn rail-notice"
        id="monthEndNotice"
        type="button"
        aria-label="Month ended notification"
        title="Month ended notification"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          aria-hidden="true"
        >
          <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4" />
        </svg>
        <span class="notice-indicator" aria-hidden="true"></span>
      </button>

      <div class="main-area">
        <div class="topbar">
          <img
            class="brand-wordmark"
            src="Images/logo-wordmark.svg"
            alt="ClassLedger"
          />
          <div class="nav-pills">
            <button
              class="nav-target pill active"
              data-page="students"
              type="button"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
              >
                <path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z" />
                <path d="M22 10v6" />
                <path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5" />
              </svg>
              <span id="pillStudentsLabel"></span>
            </button>
            <button class="nav-target pill" data-page="calendar" type="button">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
              >
                <rect x="3.5" y="5" width="17" height="15" rx="2.5" />
                <path d="M3.5 9.5h17M8 3v3M16 3v3" />
              </svg>
              <span id="pillCalendarLabel"></span>
            </button>
            <button class="nav-target pill" data-page="payments" type="button">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
              >
                <rect x="3" y="6" width="18" height="13" rx="2.5" />
                <path d="M3 10h18" />
                <circle
                  cx="16.5"
                  cy="14.5"
                  r="1.3"
                  fill="currentColor"
                  stroke="none"
                />
              </svg>
              <span id="pillPaymentsLabel"></span>
            </button>
          </div>
          <div class="topbar-end">
            <div class="lang-switch" id="langSwitch">
              <button type="button" class="lang-btn" data-lang="en">EN</button>
              <button type="button" class="lang-btn" data-lang="ar">AR</button>
            </div>
            <div class="t-user-wrap" id="tUserWrap" hidden>
              <button type="button" class="t-user" id="tUser" aria-haspopup="menu" aria-expanded="false"></button>
              <div class="t-menu" id="tMenu" role="menu" hidden>
                <div class="cloud-sync" id="cloudSync" hidden></div>
              </div>
            </div>
          </div>
        </div>

        <header class="page-header">
          <div>
            <h1 id="pageTitle"></h1>
            <p class="page-date" id="pageDate"></p>
          </div>
          <div class="header-actions" id="actionsStudents">
            <button
              class="btn btn-primary"
              id="openAddBtn"
              type="button"
            ></button>
          </div>
          <div
            class="header-actions"
            id="actionsCalendar"
            style="display: none"
          >
            <button class="btn-icon" id="calPrevBtn" type="button">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M15 6l-6 6 6 6" />
              </svg>
            </button>
            <button
              class="btn btn-ghost"
              id="calTodayBtn"
              type="button"
            ></button>
            <button class="btn-icon" id="calNextBtn" type="button">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M9 6l6 6-6 6" />
              </svg>
            </button>
          </div>
        </header>

        <main>
          <!-- ================= STUDENTS PAGE ================= -->
          <section class="page active" id="page-students">
            <div class="hero">
              <img
                class="hero-watermark"
                src="Images/logo-icon.svg"
                alt=""
                aria-hidden="true"
              />
              <div class="hero-content">
                <h2 id="heroGreeting"></h2>
                <p id="heroText"></p>
              </div>
            </div>

            <div class="overview">
              <div class="kpi-row" id="kpiRow"></div>
              <div class="overview-charts">
                <div class="chart-card donut-card">
                  <p class="chart-title" id="distributionTitleEl"></p>
                  <div class="donut-wrap">
                    <svg
                      viewBox="0 0 200 104"
                      class="donut-svg"
                      role="img"
                      aria-labelledby="distributionTitleEl"
                    >
                      
                      <path
                        class="donut-track"
                        d="M 20 100 A 80 80 0 0 1 180 100"
                        pathLength="100"
                      ></path>
                      <path
                        id="donutCollege"
                        class="donut-seg"
                        data-seg="college"
                        tabindex="0"
                        d="M 20 100 A 80 80 0 0 1 180 100"
                        pathLength="100"
                      ></path>
                      <path
                        id="donutLycee"
                        class="donut-seg"
                        data-seg="lycee"
                        tabindex="0"
                        d="M 20 100 A 80 80 0 0 1 180 100"
                        pathLength="100"
                      ></path>
                    </svg>
                    <div class="donut-center">
                      <b id="donutTotal">0</b>
                      <span id="donutTotalLabel"></span>
                      <small id="donutSub" dir="ltr"></small>
                    </div>
                  </div>
                  <div class="donut-legend">
                    <span class="legend-item" data-seg="college" tabindex="0"
                      ><i class="legend-dot" id="legendCollegeDot"></i
                      ><span id="legendCollegeLabel"></span>
                      <b id="legendCollegeValue">0</b></span
                    >
                    <span class="legend-item" data-seg="lycee" tabindex="0"
                      ><i class="legend-dot" id="legendLyceeDot"></i
                      ><span id="legendLyceeLabel"></span>
                      <b id="legendLyceeValue">0</b></span
                    >
                  </div>
                </div>
                <div class="chart-card bar-card">
                  <p class="chart-title" id="byLevelTitleEl"></p>
                  <div class="bar-chart" id="barChart"></div>
                </div>
              </div>
            </div>

            <div class="controls">
              <input type="text" class="search-input" id="searchInput" />
              <select class="filter-select" id="levelFilter"></select>
              <select class="filter-select" id="groupFilter"></select>
              <button type="button" class="stopped-toggle" id="stoppedToggle" aria-pressed="false" hidden></button>
            </div>
            <div
              class="group-filter-summary"
              id="groupFilterSummary"
              aria-live="polite"
              hidden
            ></div>

            <div class="cards-grid" id="tableWrap"></div>
          </section>

          <!-- ================= CALENDAR PAGE ================= -->
          <section class="page" id="page-calendar">
            <div class="calendar-layout">
              <div class="calendar-card">
                <p class="calendar-title" id="calMonthLabel"></p>
                <div class="cal-grid" id="calGrid"></div>
              </div>
              <div class="events-card">
                <h3 id="eventsTitle" tabindex="-1"></h3>
                <p class="sub" id="eventsSub"></p>
                <div class="legend">
                  <span
                    ><i style="background: var(--color-primary)"></i
                    ><span id="legendStartLabel"></span
                  ></span>
                  <span
                    ><i style="background: var(--color-accent-ink)"></i
                    ><span id="legendEndLabel"></span
                  ></span>
                  <span
                    ><i style="background: var(--color-study-day)"></i
                    ><span id="legendStudyLabel"></span
                  ></span>
                </div>
                <div id="eventsList"></div>
              </div>
              <section class="groups-card" aria-labelledby="groupsTitle">
                <div class="groups-heading">
                  <div>
                    <h3 id="groupsTitle"></h3>
                    <p id="groupsHint"></p>
                  </div>
                  <span class="groups-total" id="groupsTotal"></span>
                </div>
                <form class="groups-add-form" id="groupsAddForm">
                  <label
                    class="visually-hidden"
                    for="newGroupName"
                    id="newGroupLabel"
                  ></label>
                  <input
                    id="newGroupName"
                    type="text"
                    maxlength="50"
                    required
                  />
                  <button
                    class="btn btn-primary"
                    id="addGroupBtn"
                    type="submit"
                  ></button>
                </form>
                <div class="groups-list" id="groupsList"></div>
              </section>
            </div>
          </section>

          <!-- ================= PAYMENTS PAGE ================= -->
          <section class="page" id="page-payments">
            <div class="overview">
              <div class="kpi-row" id="paymentsKpiRow"></div>
            </div>
            <div class="payments-list" id="paymentsList"></div>
            <section class="half-month-calculator">
              <div class="half-month-tools">
                <div>
                  <h2 id="halfMonthTitle"></h2>
                  <p id="halfMonthHint"></p>
                </div>
                <div class="half-month-controls">
                  <div
                    class="half-month-mode"
                    id="halfMonthMode"
                    role="group"
                  >
                    <button
                      type="button"
                      class="half-month-mode-btn active"
                      data-mode="half"
                      id="halfMonthModeHalf"
                      aria-pressed="true"
                    ></button>
                    <button
                      type="button"
                      class="half-month-mode-btn"
                      data-mode="custom"
                      id="halfMonthModeCustom"
                      aria-pressed="false"
                    ></button>
                  </div>
                  <label class="half-month-amount" id="halfMonthAmountWrap" hidden>
                    <input
                      type="number"
                      id="halfMonthAmount"
                      min="0"
                      step="0.5"
                      inputmode="decimal"
                    />
                    <span id="halfMonthAmountUnit"></span>
                  </label>
                  <button
                    class="half-month-picker-trigger"
                    id="halfMonthPickerLabel"
                    type="button"
                    aria-haspopup="dialog"
                    aria-expanded="false"
                  ></button>
                  <button
                    class="btn btn-primary"
                    id="halfMonthCalculateBtn"
                    type="button"
                    disabled
                  ></button>
                </div>
              </div>
              <div
                class="half-month-result"
                id="halfMonthResult"
                aria-live="polite"
                hidden
              ></div>
            </section>
          </section>
        </main>
        <div class="data-reset-area">
          <div class="data-transfer-actions">
            <button type="button" class="data-transfer-btn" id="exportDataBtn">
              <span class="data-btn-icon">
                <svg
                  viewBox="0 0 24 24"
                  aria-hidden="true"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                >
                  <path d="M12 3v12m0 0 4-4m-4 4-4-4M5 20h14" />
                </svg>
              </span>
              <span id="exportDataLabel">Export data</span>
            </button>
            <button type="button" class="data-transfer-btn" id="importDataBtn">
              <span class="data-btn-icon">
                <svg
                  viewBox="0 0 24 24"
                  aria-hidden="true"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                >
                  <path d="M12 15V3m0 0L8 7m4-4 4 4M5 20h14" />
                </svg>
              </span>
              <span id="importDataLabel">Import data</span>
            </button>
            <input
              type="file"
              id="importFile"
              accept="application/json,.json"
              hidden
            />
          </div>
          <button
            type="button"
            class="data-reset-btn"
            id="clearDataBtn"
            aria-label="Clear all student data"
            title="Clear all student data"
          >
            <span class="data-btn-icon">
              <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
              >
                <path d="M4 7h16M9 7V4h6v3m-9 0 1 13h8l1-13M10 11v5m4-5v5" />
              </svg>
            </span>
            <span id="clearDataLabel">Clear all data</span>
          </button>
        </div>
      </div>
    </div>

    <!-- ============ Add/Edit Modal ============ -->
    <div class="modal-overlay" id="modalOverlay">
      <div
        class="modal modal-fixed"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalTitle"
      >
        <button type="button" class="modal-x" id="cancelBtn">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <path d="m6 6 12 12M18 6 6 18" />
          </svg>
        </button>
        <div class="modal-scroll">
        <h2 id="modalTitle"></h2>
        <form id="studentForm">
          <input type="hidden" id="studentId" />
          <div class="field-row">
            <div class="field">
              <label id="lblFirstName" for="firstName"></label
              ><input type="text" id="firstName" required />
            </div>
            <div class="field">
              <label id="lblLastName" for="lastName"></label
              ><input type="text" id="lastName" required />
            </div>
          </div>
          <div class="field-row">
            <div class="field">
              <label id="lblLevel" for="level"></label
              ><select id="level" required></select>
            </div>
            <div class="field">
              <label id="lblGender" for="gender"></label
              ><select id="gender" required>
                <option value="" id="genderPlaceholderOpt"></option>
                <option value="male" id="genderMaleOpt"></option>
                <option value="female" id="genderFemaleOpt"></option>
              </select>
            </div>
          </div>
          <div class="field">
            <label id="lblGroup" for="studentGroup"></label>
            <input type="text" id="studentGroup" maxlength="50" readonly />
          </div>
          <div class="field-row">
            <div class="field">
              <label id="lblStartDate" for="startDate"></label
              ><input type="date" id="startDate" required />
            </div>
            <div class="field">
              <label id="lblEndDate" for="endDate"
                ><span id="lblEndDateText"></span>
                <span class="optional" id="lblEndDateOptional"></span></label
              ><input type="date" id="endDate" /><small
                id="endDateHint"
                class="field-hint"
              ></small>
            </div>
          </div>
          <div class="field">
            <label id="lblNotes" for="notes"
              ><span id="lblNotesText"></span>
              <span class="optional" id="lblNotesOptional"></span
            ></label>
            <textarea id="notes" rows="3"></textarea>
          </div>
          <div class="modal-actions">
            <button type="submit" class="profile-edit-btn" id="submitBtn">
              <span class="profile-edit-icon" id="submitIcon" aria-hidden="true"></span>
              <span class="profile-edit-label" id="submitLabel"></span>
            </button>
          </div>
        </form>
        </div>
      </div>
    </div>

    <div class="modal-overlay" id="groupModalOverlay">
      <div
        class="modal group-modal modal-fixed"
        role="dialog"
        aria-modal="true"
        aria-labelledby="groupModalTitle"
      >
        <button type="button" class="modal-x" id="groupModalCancel">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <path d="m6 6 12 12M18 6 6 18" />
          </svg>
        </button>
        <div class="modal-scroll">
          <h2 id="groupModalTitle"></h2>
          <form id="groupModalForm">
            <div class="field">
              <label id="groupModalNameLabel" for="groupModalName"></label>
              <input id="groupModalName" type="text" maxlength="50" required />
            </div>
            <div id="groupModalFields"></div>
            <div id="groupModalStudents"></div>
            <div class="modal-actions">
              <button type="submit" class="profile-edit-btn" id="groupModalSave">
                <span class="profile-edit-icon" aria-hidden="true">
                  <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="m5 12.5 4.5 4.5L19 7.5" />
              </svg>
                </span>
                <span class="profile-edit-label" id="groupModalSaveLabel"></span>
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- ============ Teacher profile modal (My account) ============ -->
    <div class="modal-overlay" id="profileModalOverlay">
      <div
        class="modal profile-modal modal-fixed"
        role="dialog"
        aria-modal="true"
        aria-labelledby="profileModalTitle"
      >
        <button type="button" class="profile-close" id="profileModalClose">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <path d="m6 6 12 12M18 6 6 18" />
          </svg>
        </button>
        <div class="modal-scroll profile-scroll">
          <div class="profile-banner"></div>
          <div class="profile-avatar" id="profileModalAvatar"></div>
          <div class="profile-body">
            <h2 class="profile-name" id="profileModalTitle"></h2>
            <div id="profileModalBody"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- ============ Student details modal (profile card) ============ -->
    <div class="modal-overlay" id="noteModalOverlay">
      <div
        class="modal profile-modal modal-fixed"
        role="dialog"
        aria-modal="true"
        aria-labelledby="noteModalTitle"
      >
        <button type="button" class="profile-close" id="noteCloseBtn">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <path d="m6 6 12 12M18 6 6 18" />
          </svg>
        </button>
        <div class="modal-scroll profile-scroll">
          <div class="profile-banner"></div>
          <div class="profile-avatar" id="noteModalAvatar"></div>
          <div class="profile-body">
            <h2 class="profile-name" id="noteModalTitle"></h2>
            <div id="noteModalBody"></div>
            <button type="button" class="profile-edit-btn" id="noteEditBtn">
              <span class="profile-edit-icon" aria-hidden="true">
                <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M12 20h9" />
                <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z" />
              </svg>
              </span>
              <span class="profile-edit-label" id="noteEditLabel"></span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- ============ Group details modal (profile card) ============ -->
    <div class="modal-overlay" id="groupDetailOverlay">
      <div
        class="modal profile-modal group-detail-modal modal-fixed"
        id="groupDetailModal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="groupDetailTitle"
      >
        <button type="button" class="profile-close" id="groupDetailClose">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <path d="m6 6 12 12M18 6 6 18" />
          </svg>
        </button>
        <div class="modal-scroll profile-scroll">
          <div class="profile-banner group-banner"></div>
          <div class="profile-avatar" id="groupDetailMark"></div>
          <div class="profile-body">
            <h2 class="profile-name" id="groupDetailTitle"></h2>
            <div id="groupDetailBody"></div>
            <button type="button" class="profile-edit-btn" id="groupDetailEditBtn">
              <span class="profile-edit-icon" aria-hidden="true">
                <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M12 20h9" />
                <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z" />
              </svg>
              </span>
              <span class="profile-edit-label" id="groupDetailEditLabel"></span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="modal-overlay" id="halfMonthModalOverlay">
      <div
        class="modal half-month-modal modal-fixed"
        role="dialog"
        aria-modal="true"
        aria-labelledby="halfMonthModalTitle"
      >
        <button type="button" class="modal-x" id="halfMonthModalX">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <path d="m6 6 12 12M18 6 6 18" />
          </svg>
        </button>
        <div class="modal-scroll">
          <h2 id="halfMonthModalTitle"></h2>
          <div
            class="half-month-picker-options"
            id="halfMonthPickerOptions"
          ></div>
          <div class="modal-actions">
            <button type="button" class="profile-edit-btn" id="halfMonthModalClose">
              <span class="profile-edit-icon" aria-hidden="true">
                <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="m5 12.5 4.5 4.5L19 7.5" />
              </svg>
              </span>
              <span class="profile-edit-label" id="halfMonthDoneLabel"></span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="modal-overlay" id="monthEndModalOverlay">
      <div
        class="modal month-end-modal modal-fixed"
        role="dialog"
        aria-modal="true"
        aria-labelledby="monthEndModalTitle"
        aria-describedby="monthEndModalMessage"
      >
        <button type="button" class="modal-x" id="monthEndModalClose">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <path d="m6 6 12 12M18 6 6 18" />
          </svg>
        </button>
        <div class="modal-scroll">
          <h2 id="monthEndModalTitle"></h2>
          <div
            id="monthEndModalMessage"
            class="month-end-modal-message month-end-notice-list"
          ></div>
        </div>
      </div>
    </div>

    <!-- ============ Action result: import / export / delete (loading → success / failure) ============ -->
    <div class="modal-overlay" id="actionResultOverlay">
      <div
        class="modal action-result"
        id="actionResultBox"
        data-state="loading"
        data-kind="import"
        role="alertdialog"
        aria-modal="true"
        aria-labelledby="actionResultTitle"
        aria-describedby="actionResultText"
      >
        <div class="action-visual" aria-hidden="true">
          <svg class="action-ring" viewBox="0 0 120 120">
            <circle
              class="action-ring-arc"
              cx="60"
              cy="60"
              r="52"
              fill="none"
              stroke-width="6"
              stroke-linecap="round"
              stroke-dasharray="62 265"
            />
            <circle
              class="action-ring-dot"
              cx="60"
              cy="60"
              r="52"
              fill="none"
              stroke-width="10"
              stroke-linecap="round"
              stroke-dasharray="0.1 326.6"
              stroke-dashoffset="-62"
            />
          </svg>
          <span class="action-disc">
            <svg
              class="action-icon action-icon-ok"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="3"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="m6.5 12.5 3.8 3.8 7.2-8" pathLength="1" />
            </svg>
            <svg
              class="action-icon action-icon-export"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.6"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M12 4v11" pathLength="1" />
              <path d="m7.5 11 4.5 4.5 4.5-4.5" pathLength="1" />
              <path d="M5 20h14" pathLength="1" />
            </svg>
            <svg
              class="action-icon action-icon-trash"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.4"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M4.5 7h15" pathLength="1" />
              <path d="M9.5 7V4.5h5V7" pathLength="1" />
              <path d="m6.5 7 .9 12.5h9.2L17.5 7" pathLength="1" />
              <path d="M10 11v5.5M14 11v5.5" pathLength="1" />
            </svg>
            <svg
              class="action-icon action-icon-err"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="3"
              stroke-linecap="round"
            >
              <path d="m7.5 7.5 9 9" pathLength="1" />
              <path d="m16.5 7.5-9 9" pathLength="1" />
            </svg>
          </span>
        </div>
        <h2 id="actionResultTitle"></h2>
        <p id="actionResultText"></p>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite">
      <span class="toast-icon" id="toastIcon"></span>
      <div class="toast-text">
        <b id="toastTitle"></b>
        <span id="toastMessage"></span>
      </div>
      <button
        type="button"
        class="toast-close"
        id="toastClose"
        aria-label="Close"
      >
        &times;
      </button>
    </div>

    <script src="JS/firebase-config.js"></script>
    <script src="JS/script.js?v=49"></script>
    <script src="JS/teacher-menu.js?v=49"></script>
    <script type="module" src="JS/firebase-sync.js?v=49"></script>
  </body>
