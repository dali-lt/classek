<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>ClassLedger</title>
    <link rel="icon" type="image/svg+xml" href="Images/logo-icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="CSS/style.css?v=2" />
    <link rel="stylesheet" href="CSS/welcome.css?v=2" />
  </head>
  <body class="welcome-body">
    <section class="welcome">
      <div class="welcome-top">
        <img
          class="welcome-logo"
          src="Images/logo-wordmark.svg"
          alt="ClassLedger"
        />
        <div class="lang-switch" id="langSwitch">
          <button type="button" class="lang-btn" data-lang="en">EN</button>
          <button type="button" class="lang-btn" data-lang="ar">AR</button>
        </div>
      </div>

      <h1 id="wTitle"></h1>
      <p class="welcome-sub" id="wSub"></p>

      <!-- Put your illustration at Images/welcome-hero.svg (logo shows until then) -->
      <div class="welcome-hero">
        <img id="wHero" src="Images/welcome-hero.svg" alt="" />
      </div>

      <div id="wPanel"></div>
      <p class="welcome-msg" id="wMsg" role="status" aria-live="polite"></p>
    </section>

    <script src="JS/firebase-config.js"></script>
    <script type="module" src="JS/welcome.js?v=2"></script>
  </body>
</html>
