<!doctype html>
<html lang="fr" dir="ltr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>ClassLedger</title>
    <link rel="icon" type="image/svg+xml" href="Images/logo-icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="CSS/style.css" />
    <link rel="stylesheet" href="CSS/welcome.css?v=devices1" />
  </head>
  <body class="welcome-body">
    <div class="welcome-shell">
      <!-- the picture: pinned to the top on phones, to the side on big screens -->
      <aside class="welcome-visual">
        <img id="wHero" src="Images/welcome-hero.svg" alt="" />
      </aside>

      <section class="welcome">
        <div class="welcome-top">
          <img
            class="welcome-logo"
            src="Images/logo-wordmark.svg"
            alt="ClassLedger"
          />
          <div class="lang-switch" id="langSwitch">
            <button type="button" class="lang-btn" data-lang="fr">FR</button>
            <button type="button" class="lang-btn" data-lang="ar">AR</button>
          </div>
        </div>

        <div class="welcome-main">
          <h1 id="wTitle"></h1>
          <p class="welcome-sub" id="wSub"></p>
          <div id="wPanel"></div>
          <p class="welcome-msg" id="wMsg" role="status" aria-live="polite"></p>
        </div>
      </section>
    </div>

    <script src="JS/firebase-config.js"></script>
    <script type="module" src="JS/welcome.js?v=fr2"></script>
  </body>
</html>
