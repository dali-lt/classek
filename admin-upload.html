<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>ClassLedger · Upload content</title>
    <link rel="icon" type="image/svg+xml" href="Images/logo-icon.svg" />
    <link rel="stylesheet" href="CSS/style.css" />
    <link rel="stylesheet" href="CSS/welcome.css" />
    <link rel="stylesheet" href="CSS/chapters.css" />
    <link rel="stylesheet" href="CSS/admin-upload.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
    />
    <style>
      [hidden] { display: none !important; }
    </style>
  </head>
  <body class="student-body">
    <div class="student-wrap up-wrap">
      <header class="student-top">
        <img class="welcome-logo" src="Images/logo-wordmark.svg" alt="ClassLedger" />
        <button type="button" class="student-out" id="out" style="display: none">Sign out</button>
      </header>

      <section class="up-card">
        <div class="up-head">
          <h1>Upload content</h1>
          <p>Pick a content type, add its JSON files, then upload.</p>
          <span class="up-uid" id="uidRow" hidden>Admin uid <code id="uid"></code></span>
        </div>

        <div class="up-signin" id="signedOut">
          <p class="up-msg">Admin only. Only the uid written in <code class="ch-inline-code">firestore.rules</code> can write.</p>
          <button type="button" class="welcome-btn is-solid" id="signIn" style="width: 100%">Sign in with Google</button>
        </div>

        <div id="signedIn" hidden style="display: grid; gap: 18px">
          <div class="up-field">
            <span class="up-label" id="typeLabel">Content type</span>
            <div class="up-types" id="types" role="group" aria-labelledby="typeLabel"></div>
            <p class="up-hint" id="typeHint"></p>
          </div>

          <div class="up-drop" id="drop" tabindex="0" role="button" aria-label="Choose chapter files">
            <span class="up-drop-ico">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 18 8.5a4 4 0 0 1-.5 7.97"/><path d="M12 21v-8m0 0-3 3m3-3 3 3"/></svg>
            </span>
            <strong>Drop your files here or <u>browse</u></strong>
            <small id="dropSmall">One or many .json chapter files</small>
            <button type="button" class="up-folder" id="pickFolder">or choose a whole folder</button>
          </div>
          <input type="file" id="file" accept="application/json,.json" multiple hidden />
          <input type="file" id="folder" webkitdirectory multiple hidden />

          <div class="up-field" id="visField">
            <span class="up-label" id="visLabel">
              Visibility
            </span>
            <div class="up-seg" role="group" aria-labelledby="visLabel" id="seg">
              <button type="button" data-mode="file" aria-pressed="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>
                From file
              </button>
              <button type="button" data-mode="all" aria-pressed="false">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                Publish all
              </button>
              <button type="button" data-mode="none" aria-pressed="false">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 5.1A10 10 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.2M6.6 6.6C3.8 8.4 2 12 2 12s3.5 7 10 7a9.8 9.8 0 0 0 4.4-1"/></svg>
                Hide all
              </button>
            </div>
            <p class="up-hint" id="visHint"></p>
          </div>

          <div id="listWrap" hidden style="display: grid; gap: 10px">
            <div class="up-count"><span id="count"></span></div>
            <ul class="up-list" id="list"></ul>
          </div>

          <p class="up-msg" id="msg" role="status"></p>
          <div class="up-actions">
            <button type="button" id="clear" disabled>Clear</button>
            <button type="button" class="up-go" id="go" disabled>Upload</button>
          </div>
        </div>
      </section>
    </div>

    <script src="JS/firebase-config.js"></script>
    <script type="module">
      var BASE = "https://www.gstatic.com/firebasejs/10.14.1/";
      var mods = await Promise.all([
        import(BASE + "firebase-app.js"),
        import(BASE + "firebase-auth.js"),
        import(BASE + "firebase-firestore.js"),
      ]);
      var sdk = Object.assign({}, mods[0], mods[1], mods[2]);
      var app = sdk.initializeApp(window.CLASSLEDGER_FIREBASE_CONFIG);
      var auth = sdk.getAuth(app);
      var db = sdk.getFirestore(app);
      var $ = function (id) { return document.getElementById(id); };
      /* What can be uploaded. To add a category later, add one line here.
         kind "chapters": level (+ subject, when fixed) must match what is written in each file.
         kind "test": the placement test, stored as one document in tests/placement. */
      var TYPES = [
        { id: "test", label: "Placement test", kind: "test", hint: "One .json file with a questions list. It replaces the current placement test." },
        { id: "bac-prog", label: "Bac · Programming", kind: "chapters", level: "bac", subject: "prog" },
        { id: "bac-sti", label: "Bac · STI", kind: "chapters", level: "bac", subject: "sti" },
        { id: "3eme-prog", label: "3ème · Programming", kind: "chapters", level: "3eme", subject: "prog" },
        { id: "3eme-sti", label: "3ème · STI", kind: "chapters", level: "3eme", subject: "sti" },
        { id: "2eme", label: "2ème", kind: "chapters", level: "2eme", subject: "info" },
      ];
      var pool = []; // every parsed file {name, data}; items are the ones that fit the chosen type
      var items = []; // {data, state: "", error: ""}
      var typeId = "bac-prog";
      try { typeId = localStorage.getItem("cl-admin-type") || typeId; } catch (e) {}
      if (!TYPES.some(function (t) { return t.id === typeId; })) typeId = "bac-prog";
      var mode = "file";
      var busy = false;
      var HINTS = {
        file: "Each chapter keeps the published value written in its own JSON file (true shows it to students, false keeps it as a draft).",
        all: "Every uploaded chapter becomes visible to students right away, whatever its file says.",
        none: "Every uploaded chapter is saved as a hidden draft. Students cannot see it until you publish it.",
      };
      var ICON_OK = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.6 2.6L16 9.5"/></svg>';
      var ICON_BAD = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5v.01"/></svg>';
      var ICON_DEL = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>';

      function curType() {
        return TYPES.filter(function (t) { return t.id === typeId; })[0];
      }
      function msg(text, kind) {
        $("msg").textContent = text;
        $("msg").className = "up-msg" + (kind ? " is-" + kind : "");
      }
      function esc(t) {
        return String(t).replace(/[&<>"]/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
        });
      }
      $("signIn").addEventListener("click", function () {
        sdk.signInWithPopup(auth, new sdk.GoogleAuthProvider());
      });
      $("out").addEventListener("click", function () { sdk.signOut(auth); });
      sdk.onAuthStateChanged(auth, function (u) {
        $("signedOut").hidden = !!u;
        $("signedIn").hidden = !u;
        $("uidRow").hidden = !u;
        $("out").style.display = u ? "" : "none";
        if (u) $("uid").textContent = u.uid;
      });

      function visible(d) {
        return mode === "all" ? true : mode === "none" ? false : !!d.published;
      }
      function hintList(ex) {
        var list = Array.isArray(ex.hints) ? ex.hints : ex.hint ? [ex.hint] : [];
        return list.filter(function (h) {
          return typeof h === "string" && h.trim();
        });
      }
      function hasNestedArray(o) {
        if (Array.isArray(o)) return o.some(function (x) { return Array.isArray(x) || hasNestedArray(x); });
        if (o && typeof o === "object") return Object.keys(o).some(function (k) { return hasNestedArray(o[k]); });
        return false;
      }
      // returns "" when the file fits the chosen type, otherwise why not
      function problem(d, type) {
        if (type.kind === "test") {
          if (!d || !Array.isArray(d.questions) || !d.questions.length) return "no questions list (is this a chapter file?)";
          var badQ = d.questions.filter(function (q) {
            return !q || !q.id || typeof q.q !== "string" || !Array.isArray(q.choices) || typeof q.answer !== "number";
          }).length;
          if (badQ) return badQ + " question(s) missing id / q / choices / answer";
          if (hasNestedArray(d)) return "a list inside a list (not allowed by Firestore)";
          return "";
        }
        if (!d.chapterId || !d.level || !d.subject || !d.title || !Array.isArray(d.exercises)) {
          return Array.isArray(d.questions) ? "this is a placement test, choose “Placement test”" : "missing fields";
        }
        if (d.level !== type.level || (type.subject && d.subject !== type.subject)) {
          return "file is " + d.level + " / " + d.subject + ", not " + type.label;
        }
        return "";
      }

      // rebuild the visible list from the pool for the chosen type
      function rebuild(keepState) {
        var type = curType();
        var skipped = [];
        var old = {};
        if (keepState) items.forEach(function (it) { old[it.key] = it; });
        items = [];
        pool.forEach(function (f) {
          var why = problem(f.data, type);
          if (why) { skipped.push(f.name + " (" + why + ")"); return; }
          var key = type.kind === "test" ? "test" : f.data.chapterId;
          var at = items.findIndex(function (it) { return it.key === key; });
          var entry = old[key] && old[key].data === f.data ? old[key] : { key: key, data: f.data, state: "", error: "" };
          if (at >= 0) items[at] = entry; else items.push(entry);
        });
        if (type.kind === "chapters") items.sort(function (a, b) { return (a.data.order || 0) - (b.data.order || 0); });
        render();
        msg(skipped.length ? "Not added: " + skipped.join(" · ") : "", skipped.length ? "error" : "");
      }

      function renderTypes() {
        $("types").innerHTML = TYPES.map(function (t) {
          return '<button type="button" data-type="' + t.id + '" aria-pressed="' + (t.id === typeId) + '">' + esc(t.label) + "</button>";
        }).join("");
        var type = curType();
        $("typeHint").textContent = type.kind === "test"
          ? type.hint
          : "Only " + type.label + " chapter files are accepted (level “" + type.level + "”, subject “" + type.subject + "”).";
        $("visField").hidden = type.kind === "test";
        $("dropSmall").textContent = type.kind === "test" ? "One .json placement test file" : "One or many .json chapter files";
      }
      $("types").addEventListener("click", function (e) {
        var b = e.target.closest("button[data-type]");
        if (!b || busy || b.dataset.type === typeId) return;
        typeId = b.dataset.type;
        try { localStorage.setItem("cl-admin-type", typeId); } catch (er) {}
        renderTypes();
        rebuild(false);
      });

      function render() {
        var type = curType();
        $("listWrap").hidden = !items.length;
        $("clear").disabled = busy || !items.length;
        $("go").disabled = busy || !items.length;
        if (type.kind === "test") {
          var nq = items.length ? items[0].data.questions.length : 0;
          $("count").textContent = items.length ? nq + " questions" : "";
          $("go").textContent = items.length ? "Upload placement test" : "Upload";
        } else {
          var n = items.reduce(function (t, it) { return t + it.data.exercises.length; }, 0);
          $("count").textContent = items.length + " chapter" + (items.length === 1 ? "" : "s") + " · " + n + " exercises";
          $("go").textContent = items.length ? "Upload " + items.length + " chapter" + (items.length === 1 ? "" : "s") : "Upload";
        }
        $("list").innerHTML = items.map(function (it, k) {
          var d = it.data;
          var state = it.state === "done" ? '<span class="up-state is-ok">' + ICON_OK + "</span>"
            : it.state === "fail" ? '<span class="up-state is-bad">' + ICON_BAD + "</span>"
            : '<button type="button" class="up-x" data-del="' + k + '" aria-label="Remove" ' + (busy ? "disabled" : "") + ">" + ICON_DEL + "</button>";
          var badge, title, meta;
          if (type.kind === "test") {
            badge = "?";
            title = d.title || "Placement test";
            meta = "<span>" + d.questions.length + " questions</span>";
          } else {
            var pub = visible(d);
            badge = d.order || "·";
            title = d.title;
            meta = "<span>" + d.exercises.length + " exercises</span>" +
              '<span class="up-pill ' + (pub ? "is-pub" : "is-draft") + '">' + (pub ? "Published" : "Hidden") + "</span>";
          }
          return '<li class="up-row ' + (it.state ? "is-" + it.state : "") + '" data-k="' + k + '">' +
            '<span class="up-badge">' + badge + "</span>" +
            '<div class="up-info"><div class="up-title">' + esc(title) + "</div>" +
            '<div class="up-meta">' + meta + (it.error ? '<span class="up-err">' + esc(it.error) + "</span>" : "") + "</div></div>" +
            state + '<span class="up-bar"><i></i></span></li>';
        }).join("");
      }

      async function addFiles(fileList) {
        var files = Array.prototype.slice.call(fileList).filter(function (f) { return /\.json$/i.test(f.name); });
        if (!files.length) { msg("No .json files in that selection.", "error"); return; }
        var bad = [];
        for (var i = 0; i < files.length; i++) {
          try {
            var d = JSON.parse(await files[i].text());
            pool = pool.filter(function (f) { return f.name !== files[i].name; });
            pool.push({ name: files[i].name, data: d });
          } catch (e) {
            bad.push(files[i].name + " (not valid JSON)");
          }
        }
        rebuild(true);
        if (bad.length) msg((($("msg").textContent && $("msg").textContent + " · ") || "") + "Skipped: " + bad.join(", "), "error");
      }

      var drop = $("drop");
      drop.addEventListener("click", function (e) { if (e.target.id !== "pickFolder") $("file").click(); });
      drop.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("file").click(); }
      });
      $("pickFolder").addEventListener("click", function () { $("folder").click(); });
      ["dragenter", "dragover"].forEach(function (ev) {
        drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add("is-over"); });
      });
      ["dragleave", "drop"].forEach(function (ev) {
        drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove("is-over"); });
      });
      drop.addEventListener("drop", function (e) { addFiles(e.dataTransfer.files); });
      ["file", "folder"].forEach(function (id) {
        $(id).addEventListener("change", function () { addFiles($(id).files); $(id).value = ""; });
      });

      $("seg").addEventListener("click", function (e) {
        var b = e.target.closest("button[data-mode]");
        if (!b || busy) return;
        mode = b.dataset.mode;
        Array.prototype.forEach.call($("seg").children, function (x) {
          x.setAttribute("aria-pressed", x === b ? "true" : "false");
        });
        $("visHint").textContent = HINTS[mode];
        render();
      });
      $("visHint").textContent = HINTS[mode];

      $("list").addEventListener("click", function (e) {
        var b = e.target.closest("[data-del]");
        if (!b || busy) return;
        var it = items[+b.dataset.del];
        items.splice(+b.dataset.del, 1);
        pool = pool.filter(function (f) { return f.data !== it.data; });
        render();
      });
      $("clear").addEventListener("click", function () { items = []; pool = []; render(); msg(""); });

      async function uploadOne(data, bar) {
        if (curType().kind === "test") {
          bar.style.width = "40%";
          await sdk.setDoc(sdk.doc(db, "tests", "placement"), Object.assign({}, data, { updatedAt: sdk.serverTimestamp() }));
          bar.style.width = "100%";
          return;
        }
        var chRef = sdk.doc(db, "chapters", data.chapterId);
        var batch = sdk.writeBatch(db);
        batch.set(chRef, {
          level: data.level,
          subject: data.subject,
          topic: data.topic || "",
          title: data.title,
          title_ar: data.title_ar || "",
          order: data.order || 0,
          part: data.part || 0,
          part_title: data.part_title || "",
          part_title_ar: data.part_title_ar || "",
          published: visible(data),
          rappel: data.rappel || "",
          exerciseCount: data.exercises.length,
          updatedAt: sdk.serverTimestamp(),
        });
        data.exercises.forEach(function (ex) {
          var exRef = sdk.doc(db, "chapters", data.chapterId, "exercises", ex.id);
          batch.set(exRef, {
            order: ex.order || 0,
            difficulty: ex.difficulty || "easy",
            statement: ex.statement || "",
            hints: hintList(ex),
            hint: hintList(ex)[0] || "",
          });
          batch.set(sdk.doc(exRef, "private", "solution"), { text: ex.solution || "" });
        });
        bar.style.width = "40%";
        await batch.commit();
        bar.style.width = "100%";
      }
      $("go").addEventListener("click", async function () {
        if (busy || !items.length) return;
        busy = true;
        items.forEach(function (it) { it.state = ""; it.error = ""; });
        render();
        var ok = 0;
        for (var i = 0; i < items.length; i++) {
          var row = $("list").children[i];
          row.classList.add("is-busy");
          var bar = row.querySelector(".up-bar i");
          bar.style.width = "10%";
          msg("Uploading " + (i + 1) + " / " + items.length + "…");
          try {
            await uploadOne(items[i].data, bar);
            items[i].state = "done";
            ok++;
          } catch (e) {
            items[i].state = "fail";
            items[i].error = e.code || e.message;
          }
          row.classList.remove("is-busy");
          render();
        }
        var failed = items.length - ok;
        msg(ok + " uploaded" + (failed ? ", " + failed + " failed" : "") + ".", failed ? "error" : "ok");
        busy = false;
        render();
      });
      renderTypes();
      render();
    </script>
  </body>
</html>
