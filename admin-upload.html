<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>ClassLedger · Upload chapters</title>
    <link rel="icon" type="image/svg+xml" href="Images/logo-icon.svg" />
    <link rel="stylesheet" href="CSS/style.css" />
    <link rel="stylesheet" href="CSS/welcome.css" />
    <link rel="stylesheet" href="CSS/chapters.css" />
    <style>
      [hidden] { display: none !important; }
    </style>
  </head>
  <body class="student-body">
    <div class="student-wrap" style="max-width: 640px">
      <header class="student-top">
        <img class="welcome-logo" src="Images/logo-wordmark.svg" alt="ClassLedger" />
        <button type="button" class="student-out" id="out" style="display: none">Sign out</button>
      </header>

      <section class="ch-block">
        <h1 style="margin: 0 0 6px; font-size: 20px">Upload chapters</h1>
        <p class="welcome-sub">
          Admin only. Only the uid written in <code class="ch-inline-code">firestore.rules</code> can write.
        </p>
        <div id="signedOut" style="margin-top: 12px">
          <button type="button" class="welcome-btn is-solid" id="signIn" style="width: 100%">Sign in with Google</button>
        </div>
        <div id="signedIn" hidden style="display: grid; gap: 12px; margin-top: 12px">
          <p class="welcome-sub">Your uid: <code class="ch-inline-code" id="uid"></code></p>
          <input type="file" id="file" accept="application/json,.json" multiple />
          <label style="display: grid; gap: 4px; font-size: 14px">
            Visibility
            <select id="pubMode" class="note-input">
              <option value="file">As written in each file (published: true / false)</option>
              <option value="all">Publish all (visible to students)</option>
              <option value="none">Hide all</option>
            </select>
          </label>
          <button type="button" class="pc-btn" id="go" disabled>Upload</button>
          <p class="welcome-msg" id="msg" role="status"></p>
        </div>
      </section>
    </div>

    <script src="JS/firebase-config.js"></script>
    <script type="module">
      var BASE = "https://www.gstatic.com/firebasejs/10.14.1/";
      var mods = await Promise.all([
        import(BASE + "firebase-app.js"),
        import(BASE + "firebase-auth.js"),
        import(BASE + "firebase-firestore.js"),
      ]);
      var sdk = Object.assign({}, mods[0], mods[1], mods[2]);
      var app = sdk.initializeApp(window.CLASSLEDGER_FIREBASE_CONFIG);
      var auth = sdk.getAuth(app);
      var db = sdk.getFirestore(app);
      var $ = function (id) { return document.getElementById(id); };
      var items = []; // parsed chapter files
      var busy = false;

      function msg(text, bad) {
        $("msg").textContent = text;
        $("msg").classList.toggle("is-error", !!bad);
      }
      $("signIn").addEventListener("click", function () {
        sdk.signInWithPopup(auth, new sdk.GoogleAuthProvider());
      });
      $("out").addEventListener("click", function () { sdk.signOut(auth); });
      sdk.onAuthStateChanged(auth, function (u) {
        $("signedOut").hidden = !!u;
        $("signedIn").hidden = !u;
        $("out").style.display = u ? "" : "none";
        if (u) $("uid").textContent = u.uid;
      });
      $("file").addEventListener("change", async function () {
        items = [];
        $("go").disabled = true;
        var files = Array.prototype.slice.call($("file").files);
        if (!files.length) return;
        var bad = [];
        for (var i = 0; i < files.length; i++) {
          try {
            var d = JSON.parse(await files[i].text());
            if (!d.chapterId || !d.level || !d.subject || !d.title || !Array.isArray(d.exercises)) throw new Error("missing fields");
            items.push(d);
          } catch (e) {
            bad.push(files[i].name + " (" + e.message + ")");
          }
        }
        $("go").disabled = !items.length;
        var n = items.reduce(function (t, d) { return t + d.exercises.length; }, 0);
        msg(
          items.length + " chapter(s), " + n + " exercise(s) ready." + (bad.length ? " Invalid: " + bad.join(", ") : ""),
          !!bad.length
        );
      });
      function visible(d) {
        var mode = $("pubMode").value;
        return mode === "all" ? true : mode === "none" ? false : !!d.published;
      }
      function hintList(ex) {
        var list = Array.isArray(ex.hints) ? ex.hints : ex.hint ? [ex.hint] : [];
        return list.filter(function (h) {
          return typeof h === "string" && h.trim();
        });
      }
      async function uploadOne(data) {
        var chRef = sdk.doc(db, "chapters", data.chapterId);
        var batch = sdk.writeBatch(db);
        batch.set(chRef, {
          level: data.level,
          subject: data.subject,
          topic: data.topic || "",
          title: data.title,
          title_ar: data.title_ar || "",
          order: data.order || 0,
          part: data.part || 0,
          part_title: data.part_title || "",
          part_title_ar: data.part_title_ar || "",
          published: visible(data),
          rappel: data.rappel || "",
          exerciseCount: data.exercises.length,
          updatedAt: sdk.serverTimestamp(),
        });
        data.exercises.forEach(function (ex) {
          var exRef = sdk.doc(db, "chapters", data.chapterId, "exercises", ex.id);
          batch.set(exRef, {
            order: ex.order || 0,
            difficulty: ex.difficulty || "easy",
            statement: ex.statement || "",
            hints: hintList(ex),
            hint: hintList(ex)[0] || "",
          });
          batch.set(sdk.doc(exRef, "private", "solution"), { text: ex.solution || "" });
        });
        await batch.commit();
      }
      $("go").addEventListener("click", async function () {
        if (busy || !items.length) return;
        busy = true;
        $("go").disabled = true;
        var ok = 0;
        var failed = [];
        for (var i = 0; i < items.length; i++) {
          msg("Uploading " + (i + 1) + " / " + items.length + ": " + items[i].title + "…");
          try {
            await uploadOne(items[i]);
            ok++;
          } catch (e) {
            failed.push(items[i].chapterId + " (" + (e.code || e.message) + ")");
          }
        }
        msg(ok + " chapter(s) uploaded." + (failed.length ? " Failed: " + failed.join(", ") : ""), !!failed.length);
        busy = false;
        $("go").disabled = false;
      });
    </script>
  </body>
</html>
