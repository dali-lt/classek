<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Test aperçu</title>
<style>body{font:15px/1.5 system-ui,sans-serif;margin:20px;max-width:760px}h1{font-size:20px}.row{display:grid;grid-template-columns:240px 1fr;gap:12px;align-items:center;margin:10px 0}iframe{width:100%;height:70px;border:2px solid #0464de;border-radius:10px;background:#fff}code{background:#eef;padding:2px 6px;border-radius:6px}</style></head>
<body>
<h1>Test de l'aperçu (Classek)</h1>
<p>Chaque cadre doit afficher un titre « OK » en noir. Dis-moi lesquels sont vides.</p>
<div id="out"></div>
<p id="info"></p>
<script>
var CODE = '<h1 style="margin:6px">OK</h1>';
var out = document.getElementById("out");
function row(label, make) {
  var r = document.createElement("div"); r.className = "row";
  var l = document.createElement("div"); l.innerHTML = label;
  var f = document.createElement("iframe");
  make(f); r.append(l, f); out.append(r);
}
row("<b>A</b> srcdoc + sandbox (version actuelle)", function (f) { f.setAttribute("sandbox", "allow-scripts allow-forms allow-modals"); f.srcdoc = "<!doctype html>" + CODE; });
row("<b>B</b> srcdoc + sandbox simple", function (f) { f.setAttribute("sandbox", "allow-scripts"); f.srcdoc = "<!doctype html>" + CODE; });
row("<b>C</b> srcdoc sans sandbox", function (f) { f.srcdoc = "<!doctype html>" + CODE; });
row("<b>D</b> blob + sandbox", function (f) { f.setAttribute("sandbox", "allow-scripts"); f.src = URL.createObjectURL(new Blob(["<!doctype html>" + CODE], { type: "text/html" })); });
row("<b>E</b> document.write (même origine)", function (f) { f.addEventListener("load", function () { if (f.__done) return; f.__done = true; var d = f.contentDocument; d.open(); d.write("<!doctype html>" + CODE); d.close(); }); f.src = "about:blank"; });
document.getElementById("info").textContent = navigator.userAgent + " | sécurisé: " + window.isSecureContext + " | thème sombre: " + (matchMedia("(prefers-color-scheme: dark)").matches);
</script></body></html>
