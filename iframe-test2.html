<!doctype html>
<html lang="fr" data-theme="light"><head><meta charset="utf-8"><title>Test aperçu 2</title>
<link rel="stylesheet" href="CSS/style.css?v=49">
<link rel="stylesheet" href="CSS/welcome.css?v=68">
<link rel="stylesheet" href="CSS/chapters.css?v=77">
<style>body{padding:20px;max-width:760px;margin:auto}.lab{font-weight:700;margin:18px 0 6px}</style></head>
<body>
<h1>Test 2 : mêmes styles que le site</h1>
<p>Chaque fenêtre doit afficher « OK » en noir. Dis-moi lesquelles sont vides.</p>
<div id="out"></div>
<script>
var CODE = '<!doctype html><h1 style="margin:6px">OK</h1>';
var out = document.getElementById("out");
function win(label, opts) {
  var l = document.createElement("div"); l.className = "lab"; l.textContent = label; out.append(l);
  var host = document.createElement("div"); if (opts.host) host.setAttribute("style", opts.host);
  var w = document.createElement("div"); w.className = "live-frame pg-win" + (opts.cls ? " " + opts.cls : "");
  w.innerHTML = '<div class="live-bar pg-bar"><span class="pg-dots"><i></i><i></i><i></i></span><span class="live-url"><i class="live-dot"></i>Résultat</span></div>';
  var f = document.createElement("iframe"); f.className = "live-iframe";
  f.setAttribute("sandbox", "allow-scripts allow-forms allow-modals");
  if (opts.fstyle) f.setAttribute("style", opts.fstyle);
  f.srcdoc = CODE;
  w.append(f); host.append(w); out.append(host);
}
win("1. Comme le site", {});
win("2. Sans resize sur l'iframe", { fstyle: "resize:none" });
win("3. Sans overflow caché ni coins arrondis", { cls: "", host: "", fstyle: "" });
document.querySelectorAll(".lab")[2].nextSibling.firstChild.setAttribute("style", "overflow:visible;border-radius:0;box-shadow:none");
win("4. Sans ombre", { cls: "", fstyle: "" });
document.querySelectorAll(".lab")[3].nextSibling.firstChild.setAttribute("style", "box-shadow:none");
win("5. Dans un conteneur avec container-type (comme .pg-host)", { host: "container-type:inline-size" });
win("6. Dans un bloc légèrement tourné (comme la feuille du cours)", { host: "transform:rotate(-0.5deg)" });
win("7. Avec fond blanc forcé et color-scheme clair", { fstyle: "color-scheme:light;background:#fff" });
</script></body></html>
